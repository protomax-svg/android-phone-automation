# Android proxy gateway - non-secret settings (installed to /etc/android-proxy-gw/gw.conf)
IFACE=wlp0s20f3          # PC Wi-Fi card used as hotspot (PC itself stays on Ethernet)
GW_IP=10.77.0.1
PREFIX=24
DHCP_START=10.77.0.10
DHCP_END=10.77.0.60
SSID=phone-gw
NM_CON=android-proxy-ap
REDIR_PORT=12345         # sing-box transparent TCP inbound
DNS_PORT=15353           # sing-box DNS inbound (phone DNS -> DoH through the proxy)
AUTOSTART=1              # 1 = start the gateway at boot in PROXY mode (re-run install.sh after changing)
TZ_SYNC=1                # 1 = phone timezone follows the exit IP; phone traffic is HELD until they match
TZ_CHECK_SEC=60          # exit IP re-check interval (each check is ~1 KB of proxy traffic)
PRIVACY_ENFORCE=1        # 1 = keep phone location, Wi-Fi/BT scanning, auto-timezone OFF (re-applied every check)
PHONE_SERIAL=e0296b53    # the ONE phone that uses this gateway (Redmi Note 11); tzsync/privacy/proxy scripts touch only it
PROBE_PORT=12346         # loopback-only sing-box inbound the PC uses to see the exit IP (same path as the phone)
